<style>
:root{
--primary:#FCD535;--primary-active:#f0b90b;--primary-disabled:#3a3a1f;
--ink:#181a20;--body:#eaecef;--muted:#707a8a;--muted-strong:#929aa5;
--hairline:#2b3139;--canvas:#0b0e11;--card:#1e2329;--elevated:#2b3139;
--on-primary:#181a20;--on-dark:#ffffff;--up:#0ecb81;--down:#f6465d;--info:#3b82f6;--cyan:#2dbdb6;
--r-sm:4px;--r-md:6px;--r-lg:8px;--r-xl:12px;--r-2xl:16px;--r-pill:9999px;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--body);font-family:var(--font);font-size:14px;line-height:1.5;
-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ico{display:inline-block;width:15px;height:15px;stroke-width:2;vertical-align:-2px;flex-shrink:0}
.tool-ic{width:36px;height:36px;border-radius:var(--r-lg);background:var(--canvas);border:1px solid var(--hairline);
display:flex;align-items:center;justify-content:center;color:var(--primary)}


/* ---------- Sleek Dark Minimalist Scrollbars (Binance Theme) ---------- */
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #2b3139;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #474f59;
}

.stream-box, .move-list, .lang-grid {
  scrollbar-width: thin;
  scrollbar-color: #2b3139 transparent;
}
.stream-box::-webkit-scrollbar, .move-list::-webkit-scrollbar, .lang-grid::-webkit-scrollbar {
  width: 4px;
}
.stream-box::-webkit-scrollbar-track, .move-list::-webkit-scrollbar-track, .lang-grid::-webkit-scrollbar-track {
  background: rgba(11, 14, 17, 0.4);
  border-radius: 4px;
}
.stream-box::-webkit-scrollbar-thumb, .move-list::-webkit-scrollbar-thumb, .lang-grid::-webkit-scrollbar-thumb {
  background: #2b3139;
  border-radius: 4px;
  transition: background 0.2s ease;
}
.stream-box::-webkit-scrollbar-thumb:hover, .move-list::-webkit-scrollbar-thumb:hover, .lang-grid::-webkit-scrollbar-thumb:hover {
  background: rgba(252, 213, 53, 0.7);
  box-shadow: 0 0 6px rgba(252, 213, 53, 0.4);
}

/* ---------- Header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:rgba(11,14,17,.92);backdrop-filter:blur(12px);
border-bottom:1px solid var(--hairline)}
.hdr-in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:var(--r-lg);background:linear-gradient(145deg,#1e2329,#13161a);
display:flex;align-items:center;justify-content:center;color:var(--primary);
border:1px solid rgba(252,213,53,.32);
box-shadow:0 0 0 1px rgba(252,213,53,.15),0 4px 14px rgba(0,0,0,.5),0 0 20px rgba(252,213,53,.18);
transition:all .25s ease;position:relative;overflow:hidden}
.brand:hover .brand-mark{border-color:var(--primary);transform:translateY(-1px);
box-shadow:0 0 0 1px var(--primary),0 6px 20px rgba(0,0,0,.6),0 0 26px rgba(252,213,53,.32)}
.brand-mark svg{display:block;width:20px;height:20px;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.brand:hover .brand-mark svg{transform:rotate(45deg) scale(1.04)}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-size:15px;font-weight:700;color:var(--on-dark);letter-spacing:-.2px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.2px}
.live-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);
background:rgba(14,203,129,.1);border:1px solid rgba(14,203,129,.32);color:var(--up);
font-size:10px;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

/* ---------- Language dropdown ---------- */
.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-lg);
background:var(--card);border:1px solid var(--hairline);color:var(--body);font-size:12px;font-weight:500;
transition:.15s}
.lang-btn:hover{border-color:var(--primary);color:var(--on-dark)}
.lang-btn svg{transition:transform .2s}
.lang-btn.open svg{transform:rotate(180deg)}
.lang-panel{position:absolute;right:0;top:calc(100% + 8px);width:290px;padding:8px;border-radius:var(--r-xl);
background:var(--card);border:1px solid var(--hairline);box-shadow:0 16px 48px rgba(0,0,0,.6);z-index:70;display:none}
.lang-panel.open{display:block}
.lang-head{padding:6px 10px 8px;border-bottom:1px solid var(--hairline);margin-bottom:6px;
display:flex;justify-content:space-between;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-height:280px;overflow-y:auto}
.lang-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--r-md);
font-size:12px;color:var(--body);transition:.12s}
.lang-item:hover{background:var(--elevated);color:var(--on-dark)}
.lang-item.on{background:rgba(252,213,53,.1);color:var(--primary);font-weight:700}
.lang-item code{font-size:9px;color:var(--muted);text-transform:uppercase}

/* ---------- Hero Section ---------- */
main{flex:1}
.hero{padding:44px 0 24px;position:relative}
.hero-hdr{margin-bottom:24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:var(--r-pill);
background:var(--card);border:1px solid var(--hairline);font-size:11px;color:var(--muted-strong);
letter-spacing:.4px;text-transform:uppercase;font-weight:600;margin-bottom:14px}
h1{font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-1.2px;color:var(--on-dark);margin-bottom:10px}
h1 em{font-style:normal;color:var(--primary)}
.hero-p{font-size:15px;color:var(--muted-strong);max-width:720px;line-height:1.6}

/* ---------- Hero Dual Cards (Gauge + Pulse Line Chart) ---------- */
.dual-cards{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-bottom:28px}
.card-box{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:24px;
position:relative;overflow:hidden}
.card-box::after{content:"";position:absolute;inset:0;border-radius:var(--r-xl);pointer-events:none;
box-shadow:inset 0 0 60px rgba(252,213,53,.04)}

/* Left gauge card */
.gauge-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.gauge-lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.gauge-tag{padding:3px 9px;border-radius:var(--r-pill);font-size:10px;font-weight:700;
background:rgba(14,203,129,.12);color:var(--up);border:1px solid rgba(14,203,129,.3)}
.gauge-wrap{position:relative;width:190px;height:190px;margin:8px auto 4px}
.gauge-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-track{fill:none;stroke:#2b3139;stroke-width:11}
.gauge-arc{fill:none;stroke:var(--primary);stroke-width:11;stroke-linecap:round;
filter:drop-shadow(0 0 10px rgba(252,213,53,.55));
transition:stroke-dashoffset 1.8s cubic-bezier(.16,1,.3,1)}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-num{font-family:var(--mono);font-size:48px;font-weight:700;letter-spacing:-2px;color:var(--on-dark);line-height:1}
.gauge-num span{font-size:22px;color:var(--primary)}
.gauge-cap{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;padding:0 8px}
.gauge-foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline);
display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.gauge-foot b{color:var(--body);font-weight:600}
@keyframes flare{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.gauge-flare{position:absolute;top:50%;left:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
border:2px solid rgba(252,213,53,.5);animation:flare 2.6s ease-out infinite;pointer-events:none}

/* Right pulse chart card */
.pulse-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.pulse-t{font-size:14px;font-weight:700;color:var(--on-dark)}
.pulse-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pulse-badges{display:flex;gap:6px}
.badge-sm{padding:3px 8px;border-radius:var(--r-md);font-size:10px;font-family:var(--mono);font-weight:600}
.badge-reset{background:rgba(14,203,129,.15);color:var(--up);border:1px solid rgba(14,203,129,.35)}
.badge-forecast{background:rgba(252,213,53,.15);color:var(--primary);border:1px solid rgba(252,213,53,.35)}
.chart-svg-wrap{width:100%;height:190px;position:relative}
.chart-svg-wrap svg{width:100%;height:100%}

/* ---------- Alerts Strip (Subscriber & Multichannel) ---------- */
.alert-strip{background:linear-gradient(135deg,rgba(30,35,41,.9),rgba(20,24,28,.95));
border:1px solid var(--hairline);border-radius:var(--r-xl);padding:18px 24px;
display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
.alert-info{display:flex;flex-direction:column;gap:3px}
.alert-title{font-size:14px;font-weight:700;color:var(--on-dark)}
.alert-desc{font-size:12px;color:var(--muted-strong)}
.alert-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alert-input{height:36px;padding:0 12px;border-radius:var(--r-md);background:var(--canvas);
border:1px solid var(--hairline);color:var(--body);font-size:12px;outline:none;width:200px}
.alert-input:focus{border-color:var(--primary)}
.channel-pills{display:flex;gap:6px}
.ch-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r-md);
background:var(--canvas);border:1px solid var(--hairline);font-size:11px;font-weight:600;color:var(--body);
transition:.15s}
.ch-btn:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- 4-Item Quick Readout Strip ---------- */
.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);
border:1px solid var(--hairline);border-radius:var(--r-xl);overflow:hidden;margin-bottom:48px}
.readout-item{background:var(--card);padding:18px 20px}
.ro-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:6px}
.ro-v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--on-dark);line-height:1.2}
.ro-v.up{color:var(--up)}
.ro-v.y{color:var(--primary)}
.ro-s{font-size:11px;color:var(--muted);margin-top:4px}

/* ---------- Section base ---------- */
section{padding:0 0 52px}
.sec-h{margin-bottom:20px}
.sec-kick{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--primary);font-weight:700;
display:block;margin-bottom:6px}
.sec-t{font-size:28px;font-weight:600;color:var(--on-dark);letter-spacing:-.5px;line-height:1.2}
.sec-s{font-size:13px;color:var(--muted);margin-top:5px;max-width:680px}

/* ---------- 3-Column Studio Workspace ---------- */
.studio-grid{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:18px;margin-bottom:48px}
.studio-col{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:20px;
display:flex;flex-direction:column;gap:16px}
.col-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;
border-bottom:1px solid var(--hairline)}
.col-t{font-size:13px;font-weight:700;color:var(--on-dark);text-transform:uppercase;letter-spacing:.4px}
.col-badge{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:var(--r-pill);
background:var(--elevated);color:var(--muted-strong)}

/* Col 1: What moved model events */
.move-list{display:flex;flex-direction:column;gap:11px;max-height:460px;overflow-y:auto;padding-right:4px}
.move-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-lg);background:var(--canvas);border:1px solid var(--hairline);transition:border-color .15s}
.move-item:hover{border-color:rgba(252,213,53,.35)}
.move-icon{width:24px;height:24px;flex:0 0 24px;border-radius:var(--r-sm);background:rgba(252,213,53,.1);
color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.move-body{flex:1;min-width:0}
.move-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:3px}
.move-tag{font-weight:700;color:var(--on-dark);display:flex;align-items:center;gap:6px}
.move-pts{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--r-sm)}
.move-pts.up{background:rgba(14,203,129,.12);color:var(--up);border:1px solid rgba(14,203,129,.3)}
.move-pts.down{background:rgba(246,70,93,.12);color:var(--down);border:1px solid rgba(246,70,93,.3)}
.move-pts.neutral{background:rgba(252,213,53,.12);color:var(--primary);border:1px solid rgba(252,213,53,.3)}
.move-time{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px}
.move-text{font-size:12px;color:var(--muted-strong);line-height:1.55}
.move-reason{font-size:11px;color:var(--muted);margin-top:4px;border-left:2px solid var(--hairline);padding-left:6px;line-height:1.45}

/* Col 2: Tibo posts stream */
.stream-box{display:flex;flex-direction:column;gap:12px;max-height:460px;overflow-y:auto;padding-right:4px}
.post-mini{padding:12px;border-radius:var(--r-lg);background:var(--canvas);border:1px solid var(--hairline);
display:flex;flex-direction:column;gap:8px}
.pm-head{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.pm-author{font-weight:700;color:var(--on-dark);display:flex;align-items:center;gap:6px}
.pm-quote{font-size:12px;color:var(--body);line-height:1.55;border-left:2px solid var(--primary);
padding-left:8px;font-style:italic}
.pm-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:var(--mono)}

/* Col 3: Switchboard 8 Indicators */
.switch-user-card{padding:14px;border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(43,49,57,.6),rgba(30,35,41,.8));
border:1px solid rgba(252,213,53,.25);display:flex;flex-direction:column;gap:4px}
.suc-title{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.suc-num{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--primary)}
.suc-sub{font-size:10px;color:var(--muted-strong)}
.switch-items{display:flex;flex-direction:column;gap:9px}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;
border-radius:var(--r-md);background:var(--canvas);border:1px solid var(--hairline);font-size:12px}
.sr-left{display:flex;align-items:center;gap:7px}
.sr-dot{width:6px;height:6px;border-radius:50%}
.sr-dot.green{background:var(--up);box-shadow:0 0 6px var(--up)}
.sr-dot.yellow{background:var(--primary);box-shadow:0 0 6px var(--primary)}
.sr-dot.gray{background:var(--muted)}
.sr-name{font-weight:600;color:var(--body)}
.sr-status{font-family:var(--mono);font-size:10px;color:var(--muted-strong)}

/* ---------- Monthly Visual Calendar ---------- */
.cal-grid-card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:24px}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-title{font-size:16px;font-weight:700;color:var(--on-dark);display:flex;align-items:center;gap:8px}
.cal-legend{display:flex;gap:12px;font-size:11px}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:8px;height:8px;border-radius:2px}
.leg-reg{background:var(--up)}
.leg-bnk{background:var(--primary)}
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal-table th{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;padding:8px 4px;
text-align:center;border-bottom:1px solid var(--hairline)}
.cal-table td{height:76px;vertical-align:top;padding:6px;border:1px solid var(--hairline);background:var(--canvas);
position:relative;transition:.12s}
.cal-table td:hover{background:var(--card)}
.cal-table td.pad{opacity:.35;background:rgba(11,14,17,.6)}
.day-num{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;display:block}
.day-stamp{display:block;padding:3px 5px;border-radius:var(--r-sm);font-size:9px;font-family:var(--mono);
font-weight:700;line-height:1.2;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-stamp.regular{background:rgba(14,203,129,.15);color:var(--up);border:1px solid rgba(14,203,129,.35)}
.day-stamp.banked{background:rgba(252,213,53,.15);color:var(--primary);border:1px solid rgba(252,213,53,.35)}

/* ---------- Calculator ---------- */
.calc{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:26px}
.calc-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r-lg);
background:var(--canvas);border:1px solid var(--hairline);margin-bottom:18px;font-size:12px;color:var(--muted)}
select{background:var(--card);border:1px solid var(--hairline);color:var(--body);border-radius:var(--r-md);
padding:6px 9px;font-size:12px;font-family:var(--mono);outline:none}
select:focus{border-color:var(--primary)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.preset{padding:10px 8px;border-radius:var(--r-lg);border:1px solid var(--hairline);background:var(--canvas);
color:var(--muted-strong);font-size:11px;font-weight:600;transition:.14s;text-align:center}
.preset:hover{border-color:var(--primary);color:var(--primary)}
.preset.on{background:rgba(252,213,53,.12);border-color:var(--primary);color:var(--primary)}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:18px}
.clock-c{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:18px 8px}
.clock-c.hot{border-color:rgba(252,213,53,.45);background:linear-gradient(180deg,rgba(252,213,53,.06),transparent)}
.clock-v{font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:-2px;color:var(--on-dark);line-height:1}
.clock-c.hot .clock-v{color:var(--primary)}
.clock-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:7px;font-weight:600}
.prog-t{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}
.prog-bg{height:7px;border-radius:var(--r-pill);background:var(--canvas);border:1px solid var(--hairline);overflow:hidden}
.prog-fill{height:100%;width:0;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--primary),#f0b90b);transition:width .5s}
.calc-actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:18px}

/* ---------- Buttons & Tools ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 24px;height:42px;
border-radius:var(--r-md);font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-active)}
.btn-ghost{background:var(--card);color:var(--on-dark);border:1px solid var(--hairline)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
