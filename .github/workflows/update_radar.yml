name: Auto Update Codex Reset Radar

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper & Rebuild Pages
        run: |
          python scripts/scrape_tibo.py || true
          python scripts/compute_stats.py
          python scripts/build_studio.py

      - name: Commit and Push if Changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(auto-update): sync latest Tibo tweets and radar metrics [skip ci]"
          file_pattern: 'data/* site/*'
