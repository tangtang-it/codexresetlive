name: Auto Update Codex Reset Radar

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper & Rebuild Pages
        run: |
          python scripts/scrape_tibo.py
          python scripts/compute_stats.py
          python scripts/build_studio.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          if git diff --staged --quiet; then
            echo "No updates detected in Tibo's feeds."
          else
            git commit -m "chore(auto-update): sync latest Tibo tweets and radar metrics [skip ci]"
            git push
            echo "Radar updated and deployed successfully!"
          fi
